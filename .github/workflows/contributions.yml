name: Refresh contribution artwork

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/update-contributions.mjs
      - scripts/update-contributions.test.mjs
      - .github/workflows/contributions.yml

permissions:
  contents: write

concurrency:
  group: contribution-artwork
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check calendar validation
        run: node --test scripts/update-contributions.test.mjs
      - name: Fetch contribution calendar
        run: node scripts/update-contributions.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit refreshed artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contributions.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh contribution artwork'
            git push
          fi
